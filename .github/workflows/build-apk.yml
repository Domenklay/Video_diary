name: Build Android APK

on:
  push:
    branches: [main, v2.2-google-account-sync, v2.3-backup-reliability, v2.3.1-google-play-diagnostics, v2.4-safe-migration, v2.5-universe-fast-navigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
      - name: Verify Universe descriptions
        run: node --test universe/tests/interpretations.test.cjs
      - name: Verify all 12 illustrated themes
        run: python3 universe/tests/theme_assets.py
      - name: Verify Universe fast navigation contract
        run: python3 universe/tests/fast_navigation.py
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify cloud backup snapshot invariants
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuietMoments-Universe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Restore optional stable signing key
        env:
          QM_KEYSTORE_B64: ${{ secrets.QM_KEYSTORE_B64 }}
          KEY_ALIAS_SECRET: ${{ secrets.QM_KEY_ALIAS }}
          STORE_PASSWORD_SECRET: ${{ secrets.QM_KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.QM_KEY_PASSWORD }}
        run: |
          if [ -n "$QM_KEYSTORE_B64" ]; then
            if [ -z "$KEY_ALIAS_SECRET" ] || [ -z "$STORE_PASSWORD_SECRET" ] || [ -z "$KEY_PASSWORD_SECRET" ]; then
              echo "::error::Signing secrets incomplete. Configure all four QM_ secrets."
              exit 1
            fi
            printf '%s' "$QM_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quietmoments-release.jks"
            chmod 600 "$RUNNER_TEMP/quietmoments-release.jks"
            echo "QM_KEYSTORE_PATH=$RUNNER_TEMP/quietmoments-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK (unsigned until owner signing key is configured)
        env:
          QM_KEYSTORE_PASSWORD: ${{ secrets.QM_KEYSTORE_PASSWORD }}
          QM_KEY_ALIAS: ${{ secrets.QM_KEY_ALIAS }}
          QM_KEY_PASSWORD: ${{ secrets.QM_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release native-library alignment
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          # Android target 35: native libs inside the APK must be page aligned.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          fi
      - name: Upload unsigned release for owner signing
        if: env.QM_KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: QuietMoments-Universe-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Prepare local signing utilities
        if: env.QM_KEYSTORE_PATH == ''
        run: |
          mkdir -p "$RUNNER_TEMP/qm-signing-tools"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/qm-signing-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/qm-signing-tools/"
      - name: Upload local signing utilities
        if: env.QM_KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: QuietMoments-local-signing-tools
          path: ${{ runner.temp }}/qm-signing-tools/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload stable release APK
        if: env.QM_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuietMoments-Universe-stable-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
