let state=load(),route='home',period='day',historyFilter='all',selectedMood='Загадочность';function load(){try{const s=JSON.parse(localStorage.getItem(K));return{...seedState,...s,profile:{...seedState.profile,...(s?.profile||{})}}}catch(e){return JSON.parse(JSON.stringify(seedState))}}function save(){localStorage.setItem(K,JSON.stringify(state));syncNativeState()}function syncNativeState(){try{if(window.UniverseBackup)UniverseBackup.saveSnapshot(JSON.stringify(state))}catch(e){console.warn('Local backup mirror unavailable')}}function restoreNativeState(){try{if(!window.UniverseBackup)return;const raw=UniverseBackup.consumeRestore();if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){state={...seedState,...parsed,profile:{...seedState.profile,...(parsed.profile||{})}};save();}}else{syncNativeState()}}catch(e){console.warn('Unable to restore universe',e)}}function today(){return new Date().toLocaleDateString('sv-SE')}function dateStr(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}function escapeH(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function pick(list,s){return list[hash(s)%list.length]}function currentSign(){return SIGN[state.profile.sign]||SIGN[6]}function signOf(date){if(!date)return state.profile.sign;const m=Number(date.slice(5,7)),d=Number(date.slice(8,10));let n=SIGN.findIndex(x=>((m===x[2]&&d>=x[3])||(m===x[4]&&d<=x[5])));return n<0?9:n}function moonInfo(d=new Date()){const known=new Date(Date.UTC(2000,0,6,18,14)),synodic=29.530588853,phase=((d-known)/86400000/synodic%1+1)%1;let title=phase<.035||phase>.965?'Новолуние':phase<.215?'Растущая Луна':phase<.285?'Первая четверть':phase<.465?'Растущая Луна':phase<.535?'Полнолуние':phase<.715?'Убывающая Луна':phase<.785?'Последняя че function renderHoroscope(){header('Гороскопы','Прогнозы для размышления');const p=predict();return`<div class="tabs">${[['day','Сегодня'],['week','Неделя'],['month','Месяц']].map(x=>`<button class="${period===x[0]?'sel':''}" onclick="period='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${card(`${currentSign()[1]} ${p.sign} · ${period==='day'?'Сегодня':period==='week'?'Эта неделя':'Этот месяц'}`,`<p>${p.text}</p><span class="tag">Энергия ${p.energy}/10</span><div class="sectionlabel">Направления дня</div><div class="cards">${[['♡','Любовь',p.love],['♧','Дела',p.work],['◈','Финансы',p.money],['☘','Самочувствие',p.wellness]].map(x=>`<div class="listitem"><b class="gold">${x[0]} ${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><button class="primary" onclick="saveForecast()">Сохранить прогноз</button>`)}${period==='day'?card('Как тебе сегодняшний прогноз?',`<div class="pillrow">${[['fit','Подошёл'],['partly','Частично'],['no','Не подошёл']].map(x=>`<button class="pill ${state.ratings[today()+':'+state.profile.sign]===x[0]?'on':''}" onclick="rate('${x[0]}')">${x[1]}</button>`).join('')}</div>`):''}<p class="mutednote">Прогноз сформирован из локальных текстов и стабилен для указанной даты. Не является предсказанием событий.</p>`}

function renderMoon(){header('Лунный календарь','Астрономические фазы Луны');const moon=moonInfo();const shadowAngle=moon.phase;const nextFull=Math.round(((.5-moon.phase+1)%1)*29.530588853);const nextNew=Math.round(((1-moon.phase)%1)*29.530588853);return card('Луна сегодня',`<div class="illustrated-moon" role="img" aria-label="Нарисованное лунное небо"></div><div class="moonround"><div class="moonshadow" style="clip-path:${moon.phase<.5?'inset(0 0 0 '+Math.max(0,Math.round(moon.phase*200))+'%)':'inset(0 '+Math.max(0,Math.round((moon.phase-.5)*200))+'% 0 0)'}"></div></div><h2 style="text-align:center">${moon.title}</h2><div class="grid2"><div class="listitem"><div class="date">Освещённость</div><h3>${moon.lit}%</h3></div><div class="listitem"><div class="date">Возраст Луны</div><h3>${moon.age.toFixed(1)} дня</h3></div><div class="listitem"><div class="date">До полнолуния</div><h3>≈ ${nextFull} дн.</h3></div><div class="listitem"><div class="date">До новолуния</div><h3>≈ ${nextNew} дн.</h3></div></div><p class="small">Оценка по синодическому периоду. Иллюстрация фазы условная, даты приблизительные.</p>`)+card('Лунная заметка',`<textarea id="moon-note" placeholder="Каким был сегодняшний день?" maxlength="3000"></textarea><button class="primary" onclick="saveMoonNote()">Сохранить заметку</button>`)}function saveMoonNote(){const text=document.getElementById('moon-note').value.trim();if(!text)return toast('Сначала напиши заметку');state.notes.unshift({id:Date.now(),date:today(),text,kind:'moon',created:Date.now()});save();render();toast('Заметка сохранена')}
function cardToday(){const key=today();return state.dailyCards[key]||null}function renderTarot(){header('Карта дня','Символы и вопросы для себя');const daily=cardToday(),c=daily?TAROT[daily.index]:null;return`${daily?`<img class="illustrated-card" src="art/tarot_${String(daily.index).padStart(2,'0')}.svg" alt="Карта ${escapeH(c[0])}"><div class="small" style="text-align:center;margin-bottom:14px">${daily.reversed?'Перевёрнутая':'Прямая'} карта</div>${card('Послание для размышления',`<p>${c[2]}</p><div class="notice">${c[3]}</div><button class="secondary" onclick="go('dreams')">Открыть дневник записей</button>`)}`:`<div class="tarot"><div class="tarot-symbol">✺</div><div class="tarot-name">Твоя карта ждёт тебя</div><div class="eyebrow">Секрет дня</div></div><button class="primary" onclick="drawCard()">Вытянуть карту дня</button>`}<p class="mutednote">Карта выбирается один раз в календарный день на этом устройстве. Значения символические.</p>`}function drawCard(){const idx=Math.floor(Math.random()*TAROT.length),reversed=Math.random()<.25;state.dailyCards[today()]={index:idx,reversed,date:today()};save();render()}
function renderCompatibility(){header('Совместимость','О знаках и отношениях');const opts=SIGN.map((s,i)=>`<option value="${i}">${s[1]} ${s[0]}</option>`).join('');return card('Два созвездия',`<div class="fields"><div class="field"><label>Твой знак</label><div class="tag">${currentSign()[1]} ${currentSign()[0]}</div></div><div class="field"><label for="other-sign">Второй знак</label><select id="other-sign" onchange="compatResult()">${opts}</select></div><div class="field"><label for="relation">Тип отношений</label><select id="relation" onchange="compatResult()"><option value="love">Любовь</option><option value="friends">Дружба</option><option value="family">Семья</option></select></div></div><div id="compat-result"></div>`)}

function renderDreams(){header('Дневник снов','Сохраняй свои ночные истории');return card('Новый сон',`<div class="dream-art" aria-hidden="true"></div><div class="fields"><div class="field"><label for="dream-date">Когда приснилось</label><input type="date" id="dream-date" value="${today()}"></div><div class="field"><label for="dream-text">Воспоминание о сне</label><textarea id="dream-text" placeholder="Что ты увидела во сне? Какие образы запомнила?"></textarea></div><div class="field"><label for="dream-mood">Ощущение после пробуждения</label><select id="dream-mood"><option>Загадочность</option><option>Спокойствие</option><option>Радость</option><option>Тревога</option><option>Удивление</option></select></div></div><button class="primary" onclick="saveDream()">Сохранить сон</button>`)+card('Сонник',`<div class="field"><label for="symbol">Символ сна</label><input id="symbol" placeholder="Например, вода, дом, море" oninput="lookupDream()"></div><div class="listitem" id="symbol-result"><p>Введи знакомый символ, чтобы увидеть культурную интерпретацию.</p></div><p class="small">Толкования носят культурный и символический характер, не являются диагностикой или предсказанием.</p>`)+card('Мои сны',state.dreams.length?state.dreams.slice(0,6).map(d=>`<div class="listitem"><div class="date">${dateStr(d.date)} · ${escapeH(d.mood)}</div><p>${escapeH(d.text)}</p><button class="back danger" onclick="deleteDream(${d.id})">Удалить</button></div>`).join(''):'<p class="small">Пока нет сохранённых снов.</p>')}
function saveDream(){const el=document.getElementById('dream-text'),t=el.value.trim();if(!t)return toast('Опиши свой сон');state.dreams.unshift({id:Date.now(),date:document.getElementById('dream-date').value||today(),mood:document.getElementById('dream-mood').value,text:t,created:Date.now()});save();render();toast('Сон сохранён')}function deleteDream(id){if(!confirm('Удалить эту запись сна?'))return;state.dreams=state.dreams.filter(x=>x.id!==id);save();render()}function lookupDream(){const el=document.getElementById('symbol-result');const q=document.getElementById('symbol').value.trim().toLowerCase();const key=Object.keys(DREAM_WORDS).find(k=>q.includes(k));el.innerHTML='<p>'+escapeH(key?DREAM_WORDS[key]:'Пока нет толкования для этого символа. Можно добавить его в личную запись о сне.')+'</p>'}
function digits(n){while(n>9&&![11,22,33].includes(n))n=String(n).split('').reduce((s,d)=>s+Number(d),0);return n}function renderNumbers(){header('Нумерология','Числа как язык символов');const d=today().replace(/-/g,''),number=digits(d.split('').reduce((s,c)=>s+Number(c),0));let personal=state.profile.birth?digits(state.profile.birth.replace(/-/g,'').split('').reduce((s,c)=>s+Number(c),0)):null;const meanings={1:'Начало и самостоятельность',2:'Сотрудничество и равновесие',3:'Творчество и общение',4:'Порядок и устойчивость',5:'Изменения и любопытство',6:'Забота и ответственность',7:'Размышления и поиск',8:'Цели и практичность',9:'Завершение и сочувствие',11:'Вдохновение и интуиция',22:'Большие замыслы',33:'Наставничество и поддержка'};return card('Число сегодняшнего дня',`<div class="tarot" style="height:220px"><div class="tarot-symbol">${number}</div><div class="tarot-name">${meanings[number]||'Личное значение'}</div></div><p>Число получено сложением цифр даты ${dateStr(today())} с последующим приведением к одной цифре (кроме 11, 22, 33).</p><button class="primary" onclick="saveNumber(${number})">Сохранить число дня</button>`)+card('Личное число',personal?`<h2 class="gold">${personal}</h2><p>${meanings[personal]||'Символическое значение'}</p><p class="small">Рассчитано по дате рождения, указанной в профиле.</p>`:`<p>Укажи дату рождения в профиле, чтобы увидеть расчёт.</p><button class="secondary" onclick="go('profile')">Открыть профиль</button>`)+`<p class="mutednote">Нумерология — развлекательная символическая система, а не научный метод.</p>`}function saveNumber(n){if(!state.savedNumbers.some(x=>x.date===today())){state.savedNumbers.unshift({date:today(),number:n,created:Date.now()});save()}toast('Число сохранено')}
function renderHistory(){header('История вселенной','Всё, что хочется вспомнить');const records=[...state.dreams.map(x=>({...x,type:'dream',label:'Сон',detail:x.text})),...state.notes.map(x=>({...x,type:'moon',label:'Лунная заметка',detail:x.text})),...Object.values(state.dailyCards).map(x=>({...x,id:x.date,type:'tarot',label:'Карта дня',detail:TAROT[x.index][0]})),...state.savedHoroscopes.map(x=>({...x,type:'horoscope',label:'Гороскоп',detail:x.text})),...state.savedNumbers.map(x=>({...x,id:x.date,type:'number',label:'Число дня',detail:String(x.number)}))].sort((a,b)=>(b.created||new Date(b.date).getTime())-(a.created||new Date(a.date).getTime())).filter(x=>historyFilter==='all'||x.type===historyFilter);return`<div class="pillrow" style="margin:10px 0 16px">${[['all','Все'],['dream','Сны'],['tarot','Карты'],['horoscope','Прогнозы'],['moon','Луна'],['number','Числа']].map(x=>`<button class="pill ${historyFilter===x[0]?'on':''}" onclick="historyFilter='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${records.length?records.map(x=>`<div class="listitem"><div class="date">${escapeH(x.label)} · ${escapeH(x.date||today())}</div><p>${escapeH(x.detail||'')}</p></div>`).join(''):'<div class="empty">Здесь появятся сохранённые прогнозы, сны, карты и заметки.</div>'}<button class="secondary" onclick="exportData()">Экспорт моей истории</button><p class="mutednote">Связь с видео и фотографиями оригинального дневника появится после интеграции его исходного кода или базы данных.</p>`}
function exportData(){const json=JSON.stringify({version:1,app:'MyUniverse',exportedAt:new Date().toISOString(),data:state},null,2);if(window.AndroidExport&&typeof window.AndroidExport.saveJson==='function'){window.AndroidExport.saveJson(json);return}const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-universe-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const value=JSON.parse(r.result);if(value.app!=='MyUniverse'||value.version!==1||!value.data||!Array.isArray(value.data.dreams))throw Error('wrong');if(confirm('Импорт заменит текущие данные этого прототипа. Продолжить?')){state={...seedState,...value.data,profile:{...seedState.profile,...value.data.profile}};save();render();toast('Импорт завершён')}}catch(err){alert('Неверный формат резервной копии')}};r.readAsText(file)}function toast(s){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:50;background:#e0c489;color:#21192b;border-radius:12px;padding:12px 16px;box-shadow:0 7px 25px #0009;font-size:13px;white-space:nowrap';document.body.appendChild(e)}e.textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.remove(),1800)}
restoreNativeState();render();
</script>
<script>
