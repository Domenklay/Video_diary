/* v1.7 illustrated motifs. All loops are subtle, offline and optional. */
.card,.tile{position:relative}

}

}

const TAROT_DETAILS=[["Свободное начало","Шут напоминает о моменте, когда путь ещё не определён и можно учиться через опыт. Любопытство важнее идеального плана.","Прямая карта приглашает попробовать новое, разрешить себе небольшую ошибку и сделать первый шаг.","Перевёрнутая карта советует проверить, не подменяет ли спонтанность подготовку: свобода лучше работает вместе с внимательностью.","Выбери один безопасный шаг к давно интересующей теме."],["Осознанное действие","Маг объединяет желание, навыки и доступные инструменты. Его образ связан с умением превратить идею в конкретное действие.","Прямая карта предлагает заметить свои сильные стороны и воспользоваться тем, что уже под рукой.","Перевёрнутая карта просит отделить уверенность от спешки и не обещать себе больше, чем сейчас возможно.","Запиши один ресурс, который у тебя уже есть, и способ его применить."],["Внутренняя тишина","Верховная Жрица символизирует наблюдение, интуицию и скрытые от первого взгляда связи. Иногда ясность приходит после паузы.","Прямая карта советует прислушаться к чувствам и собрать факты, прежде чем делать вывод.","Перевёрнутая карта напоминает: молчание и догадки не заменяют прямого разговора, если вопрос касается другого человека.","Оставь пять минут без уведомлений и запиши одну важную мысль."],["Забота и созидание","Императрица связана с ростом, творчеством, телесным комфортом и заботой. Она напоминает, что хорошему нужно время.","Прямая карта поддерживает создание чего-то красивого и внимание к собственным потребностям.","Перевёрнутая карта спрашивает, не стало ли заботы о других больше, чем остаётся сил для себя.","Сделай что-то небольшое, что наполняет тебя: чай, цветы, рисунок или отдых."],["Опора и границы","Император олицетворяет структуру, ответственность и ясные решения. Устойчивость рождается не только из контроля, но и из последовательности.","Прямая карта помогает обозначить приоритеты и выстроить понятные границы.","Перевёрнутая карта приглашает проверить, не превратились ли правила в жёсткость, мешающую живым отношениям.","Выбери одно правило, которое облегчает твой день, и одно, которое можно смягчить."],["Знания и традиции","Иерофант символизирует обучение, ценности сообщества и связь поколений. Полезные традиции могут служить опорой.","Прямая карта предлагает спросить совета у надёжного человека или вернуться к проверенному знанию.","Перевёрнутая карта напоминает, что чужой авторитет не освобождает от собственного выбора.","Подумай, чему тебя научил близкий человек и что из этого действительно важно."],["Ценности и выбор","Влюблённые говорят не только о романтике, но и о согласии между чувствами, принципами и поступками. В центре карты — осознанный выбор.","Прямая карта поощряет честность в отношениях и верность своим ценностям.","Перевёрнутая карта предлагает заметить противоречия и поговорить о них без давления.","Сформулируй одну ценность, которой хочешь руководствоваться сегодня."],["Движение вперёд","Колесница связана с направлением, собранностью и умением удерживать цель среди отвлекающих обстоятельств.","Прямая карта поддерживает решительность, если выбранный путь действительно твой.","Перевёрнутая карта напоминает, что скорость без направления приводит к усталости; иногда стоит скорректировать маршрут.","Определи ближайший шаг и убери одно отвлекающее дело."],["Мягкая сила","Сила изображает мужество без грубости: терпение, доброту и способность не действовать из первого импульса.","Прямая карта напоминает о внутренней устойчивости и бережном обращении с собой и другими.","Перевёрнутая карта предлагает не путать стойкость с необходимостью всё выдерживать в одиночку.","Выбери ситуацию, где спокойный разговор полезнее напора."],["Поиск смысла","Отшельник — образ осознанного уединения, исследования и собственного темпа. Одиночество может быть выбором, а не изоляцией.","Прямая карта предлагает побыть наедине с вопросом и услышать собственный ответ.","Перевёрнутая карта напоминает: иногда размышления становятся способом отложить помощь или живой контакт.","Найди тихое место и запиши один честный вопрос себе."],["Циклы и перемены","Колесо Фортуны символизирует чередование этапов и непредсказуемость внешних обстоятельств. Не всё зависит от личных усилий.","Прямая карта приглашает заметить открывшуюся возможность и сохранять гибкость.","Перевёрнутая карта напоминает, что сопротивление неизбежным переменам может отнимать силы.","Назови одну вещь, на которую ты можешь повлиять сегодня, и одну, которую можно отпустить."],["Честность и равновесие","Справедливость связана с последствиями решений, честной оценкой и ответственностью перед собой и другими.","Прямая карта предлагает рассмотреть факты с нескольких сторон.","Перевёрнутая карта напоминает о риске поспешных суждений и чрезмерной строгости к себе.","Проверь, достаточно ли у тебя информации для важного вывода."],["Другой взгляд","Повешенный символизирует паузу и возможность посмотреть на знакомую ситуацию под непривычным углом. Задержка не всегда означает неудачу.","Прямая карта советует изменить точку зрения прежде, чем усиливать давление.","Перевёрнутая карта спрашивает, не превратилась ли необходимая пауза в привычку откладывать действие.","Попробуй описать сложную ситуацию глазами другого участника."],["Завершение и обновление","Смерть в Таро — символ окончания этапа и освобождения пространства для следующего, а не буквальное предсказание.","Прямая карта помогает признать, что какие-то привычки или планы уже исчерпали себя.","Перевёрнутая карта приглашает мягче отнестись к страху изменений и не требовать мгновенной готовности.","Запиши, что ты готова оставить в прошлом и что хочешь сохранить."],["Ритм и умеренность","Умеренность говорит о постепенности, соединении разных подходов и восстановлении баланса. Устойчивый ритм ценнее рывка.","Прямая карта поощряет терпение и поиск разумной меры.","Перевёрнутая карта предупреждает о крайностях — от чрезмерной нагрузки до полного отказа от движения.","Выбери одно небольшое изменение, которое сможешь поддерживать регулярно."],["Привязанности и выбор","Дьявол в Таро — метафора привычек, зависимости от чужого одобрения и ограничивающих убеждений; это не указание на мистическую угрозу.","Прямая карта предлагает честно заметить то, что удерживает тебя в привычном сценарии.","Перевёрнутая карта может напоминать о возможности постепенно вернуть свободу выбора.","Определи одну привычку, которой хотела бы управлять осознаннее."],["Перестройка основ","Башня символизирует внезапное осознание, разрушение устаревших представлений и необходимость создать более прочную опору.","Прямая карта предлагает заметить, что давно нуждается в пересмотре.","Перевёрнутая карта напоминает: не обязательно ждать кризиса, чтобы менять неработающие правила.","Выбери один маленький ремонт в планах, привычках или ожиданиях."],["Надежда и восстановление","Звезда связана с ясной надеждой, вдохновением и тихим возвращением доверия к собственным возможностям.","Прямая карта поддерживает мечты, которые помогают двигаться дальше без требования немедленного результата.","Перевёрнутая карта просит уделить внимание истощению и не сравнивать свой путь с чужим.","Запиши одну мечту и маленький источник вдохновения сегодня."],["Чувства и неопределённость","Луна отражает воображение, сомнения, сны и неоднозначные впечатления. Не всё увиденное в эмоциях равно факту.","Прямая карта предлагает бережно исследовать внутренний мир и не торопиться с выводами.","Перевёрнутая карта напоминает о пользе уточнений, если тревога строится на предположениях.","Отдели в записи то, что знаешь точно, от того, чего только опасаешься."],["Ясность и тепло","Солнце символизирует открытость, радость, жизненную энергию и удовольствие от простых моментов.","Прямая карта предлагает заметить то, что уже хорошо, и разделить радость с другими.","Перевёрнутая карта напоминает, что даже хорошие дни бывают сложными — не нужно требовать от себя постоянного оптимизма.","Зафиксируй один тёплый момент этого дня: словом, фото или видео."],["Переоценка опыта","Суд символизирует пробуждение внимания, признание уроков прошлого и решение перейти к новому этапу.","Прямая карта приглашает посмотреть на пройденный путь без самоуничижения.","Перевёрнутая карта напоминает: самокритика не должна заглушать реальные достижения.","Назови урок, который уже помог тебе стать внимательнее к себе."],["Завершённость и целостность","Мир связан с завершением цикла, интеграцией опыта и чувством своего места в большей истории.","Прямая карта предлагает отметить результат, прежде чем искать следующую цель.","Перевёрнутая карта спрашивает, не мешает ли стремление к идеалу признать уже сделанное.","Пересмотри одно старое воспоминание и отметь, чему оно тебя научило."]];

const COMPAT_RELATION={"love":["Романтические отношения","Замечайте, как каждый выражает привязанность: через слова, поступки, внимание или совместное время.","Не оценивайте близость по «правильности» знаков — обсуждайте ожидания и личные границы.","Устройте разговор о том, что каждый считает заботой.","Что помогает нам чувствовать себя любимыми и услышанными?"],"friends":["Дружеские отношения","Дружбу поддерживают общие интересы, уважение к разному темпу и возможность оставаться собой.","Не ожидайте постоянной доступности: у каждого бывают отдельные планы и потребность в тишине.","Предложите занятие, которое интересно обоим, без давления.","Какие моменты делают нашу дружбу особенно ценной?"],"family":["Семейные отношения","В семье могут сочетаться разные роли, привычки и способы показывать заботу.","Знакомые семейные сценарии порой мешают услышать новые потребности друг друга.","Обсудите одну традицию, которую хочется сохранить или изменить.","Как нам поддерживать друг друга, сохраняя личное пространство?"]};
let compatibilityOther=-1,compatibilityType='love';
function compatibilityDescription(a,b,type){
  const first=Number.isInteger(a)&&a>=0&&a<SIGN.length?a:6;
  const second=Number.isInteger(b)&&b>=0&&b<SIGN.length?b:0;
  const relationship=COMPAT_RELATION[type]||COMPAT_RELATION.love;
  const x=COMPAT_TRAITS[first],y=COMPAT_TRAITS[second];
  const key=[x[0],y[0]].sort().join('-');
  const blend=COMPAT_BLENDS[key]||COMPAT_BLENDS["вода-воздух"];
  const same=first===second;
  const modal=x[1]===y[1]
    ?`Оба знака относят к ${x[1]} типу: схожий ритм может облегчать планы, но и усиливать привычные споры.`
    :`В астрологической символике ${x[1]} и ${y[1]} типы по-разному реагируют на перемены; полезно договариваться о темпе.`;
  return `<section class="listitem compat-reading" aria-label="Подробная интерпретация совместимости">`
    +`<div class="date">${escapeH(SIGN[first][1])} ${escapeH(SIGN[first][0])} + ${escapeH(SIGN[second][1])} ${escapeH(SIGN[second][0])} · ${escapeH(relationship[0])}</div>`
    +`<h3>Общая тема: ${escapeH(blend[0])}</h3>`
    +`<p>${same?'Оба знака относятся к одному символическому образу. Схожие реакции могут помогать понимать друг друга, но важно оставлять место различиям.':escapeH(blend[1])}</p>`
    +`<div class="interpret-row"><b>Особенности первого знака</b><p>${escapeH(x[2])}; он связан с ${escapeH(x[3])}.</p></div>`
    +`<div class="interpret-row"><b>Особенности второго знака</b><p>${escapeH(y[2])}; он связан с ${escapeH(y[3])}.</p></div>`
    +`<div class="interpret-row"><b>Что может сближать</b><p>${escapeH(relationship[1])} ${escapeH(x[4])}; ${escapeH(y[4])}.</p></div>`
    +`<div class="interpret-row"><b>Где стоит быть внимательнее</b><p>${escapeH(relationship[2])} ${escapeH(modal)}</p></div>`
    +`<div class="interpret-row"><b>Совет для ваших отношений</b><p>${escapeH(blend[2])} ${escapeH(relationship[3])}</p></div>`
    +`<div class="notice"><b>Вопрос для разговора:</b> ${escapeH(relationship[4])}</div>`
    +`</section><p class="small">Это культурная символика знаков. Реальные отношения зависят от общения, взаимного уважения и обстоятельств, а не от гороскопа.</p>`;
}
function renderCompatibility(){
  header('Совместимость','Развёрнутое описание для двух знаков и типа отношений');
  const a=Number.isInteger(Number(state.profile.sign))&&Number(state.profile.sign)>=0&&Number(state.profile.sign)<12?Number(state.profile.sign):6;
  const b=compatibilityOther>=0&&compatibilityOther<12?compatibilityOther:(a+1)%12;
  const type=COMPAT_RELATION[compatibilityType]?compatibilityType:'love';
  const opts=SIGN.map((item,i)=>`<option value="${i}" ${i===b?'selected':''}>${escapeH(item[1])} ${escapeH(item[0])}</option>`).join('');
  const options=Object.entries(COMPAT_RELATION).map(([key,data])=>
    `<option value="${key}" ${type===key?'selected':''}>${escapeH(data[0])}</option>`).join('');
  return card('Два созвездия',
    `<div class="fields"><div class="field"><label>Твой знак</label><div class="tag">${escapeH(SIGN[a][1])} ${escapeH(SIGN[a][0])}</div></div>`
    +`<div class="field"><label for="other-sign">Второй знак</label><select id="other-sign" onchange="compatResult()">${opts}</select></div>`
    +`<div class="field"><label for="relation">Тип отношений</label><select id="relation" onchange="compatResult()">${options}</select></div></div>`
    +`<button class="secondary" onclick="compatResult()">Показать описание совместимости</button>`
    +`<div id="compat-result" aria-live="polite">${compatibilityDescription(a,b,type)}</div>`);
}
function compatResult(){
  const el=document.getElementById('compat-result'),selector=document.getElementById('other-sign'),relation=document.getElementById('relation');
  if(!el||!selector||!relation)return;
  const other=Number(selector.value);
  if(!Number.isInteger(other)||other<0||other>=SIGN.length){
    el.textContent='Выбери знак из списка.';return;
  }
  compatibilityOther=other;
  compatibilityType=COMPAT_RELATION[relation.value]?relation.value:'love';
  el.innerHTML=compatibilityDescription(Number(state.profile.sign),compatibilityOther,compatibilityType);
}
function renderDreams(){header('Дневник снов','Сохраняй свои ночные истории');return card('Новый сон',`<div class="dream-art" aria-hidden="true"></div><div class="fields"><div class="field"><label for="dream-date">Когда приснилось</label><input type="date" id="dream-date" value="${today()}"></div><div class="field"><label for="dream-text">Воспоминание о сне</label><textarea id="dream-text" placeholder="Что ты увидела во сне? Какие образы запомнила?"></textarea></div><div class="field"><label for="dream-mood">Ощущение после пробуждения</label><select id="dream-mood"><option>Загадочность</option><option>Спокойствие</option><option>Радость</option><option>Тревога</option><option>Удивление</option></select></div></div><button class="primary" onclick="saveDream()">Сохранить сон</button>`)+card('Сонник',`<div class="field"><label for="symbol">Символ сна</label><input id="symbol" placeholder="Например, вода, дом, море" oninput="lookupDream()"></div><div class="listitem" id="symbol-result"><p>Введи знакомый символ, чтобы увидеть культурную интерпретацию.</p></div><p class="small">Толкования носят культурный и символический характер, не являются диагностикой или предсказанием.</p>`)+card('Мои сны',state.dreams.length?state.dreams.slice(0,6).map(d=>`<div class="listitem"><div class="date">${dateStr(d.date)} · ${escapeH(d.mood)}</div><p>${escapeH(d.text)}</p><button class="back danger" onclick="deleteDream(${d.id})">Удалить</button></div>`).join(''):'<p class="small">Пока нет сохранённых снов.</p>')}
function saveDream(){const el=document.getElementById('dream-text'),t=el.value.trim();if(!t)return toast('Опиши свой сон');state.dreams.unshift({id:Date.now(),date:document.getElementById('dream-date').value||today(),mood:document.getElementById('dream-mood').value,text:t,created:Date.now()});save();render();toast('Сон сохранён')}function deleteDream(id){if(!confirm('Удалить эту запись сна?'))return;state.dreams=state.dreams.filter(x=>x.id!==id);save();render()}function lookupDream(){const el=document.getElementById('symbol-result');const q=document.getElementById('symbol').value.trim().toLowerCase();const key=Object.keys(DREAM_WORDS).find(k=>q.includes(k));el.innerHTML='<p>'+escapeH(key?DREAM_WORDS[key]:'Пока нет толкования для этого символа. Можно добавить его в личную запись о сне.')+'</p>'}
const NUMBER_READINGS={"1":["Начало и самостоятельность","Единицу связывают с инициативой, смелостью и личным выбором. Это образ первого шага, когда направление задаётся собственным решением.","В символической трактовке может напоминать о риске всё делать одной и не слышать другие мнения.","Подумай, какую инициативу давно откладываешь. Выбери первый, посильный шаг.","Где сейчас стоит действовать самостоятельно, а где попросить поддержки?"],"2":["Сотрудничество и равновесие","Двойка символизирует диалог, восприимчивость и умение учитывать другую сторону. Её сильная сторона — способность соединять разные взгляды.","Иногда стремление к миру может мешать сказать о собственных желаниях.","Выслушай близкого и спокойно обозначь одну свою потребность.","Где компромисс помогает, а где важно сохранить границу?"],"3":["Творчество и общение","Тройку связывают с выражением чувств, игрой, образами и общением. Этот символ напоминает, что идеи могут становиться живыми через слова и творчество.","Множество интересных задумок иногда мешает закончить хотя бы одну.","Сделай маленький творческий набросок или отправь тёплое сообщение.","Какой идеей сегодня хочется поделиться?"],"4":["Порядок и устойчивость","Четвёрка символизирует надёжность, последовательность и прочную основу. Она связана с ритмом, привычками и вниманием к деталям.","Избыточный контроль может оставлять мало места неожиданным возможностям.","Приведи в порядок одно небольшое дело и оставь время для спонтанности.","Какая привычка помогает тебе, а какую можно сделать гибче?"],"5":["Изменения и любопытство","Пятёрка — символ движения, новых впечатлений и свободы пробовать. Она приглашает исследовать знакомую жизнь под новым углом.","Постоянная тяга к переменам может мешать остановиться и оценить результаты.","Попробуй новый маршрут, рецепт или занятие без большого риска.","Какие перемены сейчас вдохновляют, а какие утомляют?"],"6":["Забота и ответственность","Шестёрку связывают с домом, близкими и умением создавать комфорт. Этот образ напоминает о внимательной заботе, включая заботу о себе.","Желание помочь всем иногда превращается в чрезмерную ответственность за чужие решения.","Сделай одно доброе дело, не забывая о собственных потребностях.","В каких отношениях стоит распределить заботу равномернее?"],"7":["Размышления и поиск","Семёрка символизирует любознательность, наблюдение и самостоятельное осмысление. Иногда полезно сначала разобраться, а уже потом отвечать.","Долгие размышления могут превращаться в сомнения и откладывание выбора.","Прочитай что-то новое или проведи несколько минут в тишине.","Какой вопрос сейчас заслуживает вдумчивого исследования?"],"8":["Цели и практичность","Восьмёрку связывают с организацией, амбициями и материальной стороной планов. Она символизирует умение доводить замыслы до результата.","Сосредоточенность на достижениях может заслонять отдых и личные отношения.","Раздели большую цель на два конкретных шага и отметь прогресс.","Какая цель действительно твоя, а не навязана ожиданиями?"],"9":["Завершение и сочувствие","Девятка символизирует опыт, сострадание и завершение этапов. Она приглашает собрать уроки пройденного пути, прежде чем двигаться дальше.","Стремление помочь другим порой затрудняет личное прощание с прошлым.","Поблагодари себя за уже пройденный путь и заверши одно небольшое дело.","Что ты готова отпустить с благодарностью?"],"11":["Вдохновение и интуиция","В популярных нумерологических традициях 11 считают «мастер-числом» и связывают с восприимчивостью, воображением и вдохновением.","Чувствительность к впечатлениям может усиливать сомнения, особенно если не отличать догадки от фактов.","Запиши идею, которая тебя вдохновляет, а затем проверь, как её можно воплотить.","Что в твоей интуиции стоит исследовать внимательнее?"],"22":["Большие замыслы","22 в нумерологических традициях называют «мастер-числом созидателя» и связывают с объединением дальних целей и практических действий.","Масштаб замысла может пугать, если ожидать немедленного идеального результата.","Составь реалистичный первый шаг к большой задумке.","Какие ресурсы и люди могут помочь воплотить твою идею?"],"33":["Наставничество и поддержка","33 в некоторых нумерологических школах символизирует заботу, обучение и щедрость. В центре — умение делиться опытом, не теряя себя.","Излишняя готовность спасать других может привести к усталости и размытым границам.","Поделись полезным знанием или поддержи кого-то посильным способом.","Как помогать, сохраняя уважение к чужой самостоятельности?"]};
let selectedNumerology=0;
function digits(n){while(n>9&&![11,22,33].includes(n))n=String(n).split("").reduce((sum,d)=>sum+Number(d),0);return n}
function numberInterpretation(n,title){
  const detail=NUMBER_READINGS[String(n)];
  if(!detail)return '<p class="small">Для этого числа нет толкования.</p>';
  return `<section class="listitem number-reading"><div class="date">${escapeH(title||'Толкование числа')} · ${n}</div><h3>${escapeH(detail[0])}</h3>`
   +`<div class="interpret-row"><b>Что символизирует</b><p>${escapeH(detail[1])}</p></div>`
   +`<div class="interpret-row"><b>Обратная сторона</b><p>${escapeH(detail[2])}</p></div>`
   +`<div class="interpret-row"><b>Небольшой шаг</b><p>${escapeH(detail[3])}</p></div>`
   +`<div class="notice"><b>Вопрос для размышления:</b> ${escapeH(detail[4])}</div></section>`;
}
function renderNumbers(){
  header('Нумерология','Числа с подробным символическим толкованием');
  const todayString=today(),sumDigits=date=>date.replace(/-/g,'').split('').reduce((sum,c)=>sum+Number(c),0);
  const number=digits(sumDigits(todayString));
  const personal=state.profile.birth?digits(sumDigits(state.profile.birth)):null;
  const selected=NUMBER_READINGS[String(selectedNumerology)]?selectedNumerology:number;
  const options=Object.keys(NUMBER_READINGS).sort((a,b)=>Number(a)-Number(b))
    .map(n=>`<option value="${n}" ${Number(n)===selected?'selected':''}>${n} · ${escapeH(NUMBER_READINGS[n][0])}</option>`).join('');
  return card('Число сегодняшнего дня',
    `<div class="tarot" style="height:190px"><div class="tarot-symbol">${number}</div><div class="tarot-name">${escapeH(NUMBER_READINGS[String(number)][0])}</div></div>`
     +numberInterpretation(number,'Число дня')
     +`<p>Получено сложением цифр даты ${dateStr(todayString)} с сокращением результата (кроме чисел 11, 22 и 33).</p>`
     +`<button class="primary" onclick="saveNumber(${number})">Сохранить число дня</button>`)
    +card('Личное число',personal!==null
      ?`<h2 class="gold">${personal}</h2>${numberInterpretation(personal,'Личное число')}<p class="small">Вычислено из даты рождения в профиле.</p>`
      :`<p>Чтобы узнать личное число, необязательно создавать новый аккаунт: просто укажи дату рождения в личном профиле.</p><button class="secondary" onclick="go('profile')">Открыть профиль</button>`)
    +card('Справочник чисел',
      `<p>Выбери любое число — его значение появится ниже сразу после выбора.</p>`
       +`<div class="field"><label for="number-choice">Число для толкования</label><select id="number-choice" onchange="updateNumberDescription()">${options}</select></div>`
       +`<button class="secondary" onclick="updateNumberDescription()">Показать значение</button>`
       +`<div id="number-reading" aria-live="polite">${numberInterpretation(selected,'Выбранное число')}</div>`)
    +`<p class="mutednote">Нумерология — развлекательная символическая традиция, а не научный метод определения характера или будущего.</p>`;
}
function updateNumberDescription(){
  const select=document.getElementById('number-choice'),target=document.getElementById('number-reading');
  if(!select||!target)return;
  const n=Number(select.value);
  if(!NUMBER_READINGS[String(n)]){target.textContent='Выбери число из списка.';return;}
  selectedNumerology=n;
  target.innerHTML=numberInterpretation(n,'Выбранное число');
}
function saveNumber(n){
  if(!state.savedNumbers.some(x=>x.date===today())){
    state.savedNumbers.unshift({date:today(),number:n,created:Date.now()});
    save();
  }
  toast('Число сохранено');
}
function renderHistory(){header('История вселенной','Всё, что хочется вспомнить');const records=[...state.dreams.map(x=>({...x,type:'dream',label:'Сон',detail:x.text})),...state.notes.map(x=>({...x,type:'moon',label:'Лунная заметка',detail:x.text})),...Object.values(state.dailyCards).map(x=>({...x,id:x.date,type:'tarot',label:'Карта дня',detail:TAROT[x.index][0]})),...state.savedHoroscopes.map(x=>({...x,type:'horoscope',label:'Гороскоп',detail:x.text})),...state.savedNumbers.map(x=>({...x,id:x.date,type:'number',label:'Число дня',detail:String(x.number)}))].sort((a,b)=>(b.created||new Date(b.date).getTime())-(a.created||new Date(a.date).getTime())).filter(x=>historyFilter==='all'||x.type===historyFilter);return`<div class="pillrow" style="margin:10px 0 16px">${[['all','Все'],['dream','Сны'],['tarot','Карты'],['horoscope','Прогнозы'],['moon','Луна'],['number','Числа']].map(x=>`<button class="pill ${historyFilter===x[0]?'on':''}" onclick="historyFilter='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${records.length?records.map(x=>`<div class="listitem"><div class="date">${escapeH(x.label)} · ${escapeH(x.date||today())}</div><p>${escapeH(x.detail||'')}</p></div>`).join(''):'<div class="empty">Здесь появятся сохранённые прогнозы, сны, карты и заметки.</div>'}<button class="secondary" onclick="exportData()">Экспорт моей истории</button><p class="mutednote">Связь с видео и фотографиями оригинального дневника появится после интеграции его исходного кода или базы данных.</p>`}
function exportData(){const json=JSON.stringify({version:1,app:'MyUniverse',exportedAt:new Date().toISOString(),data:state},null,2);if(window.AndroidExport&&typeof window.AndroidExport.saveJson==='function'){window.AndroidExport.saveJson(json);return}const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-universe-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const value=JSON.parse(r.result);if(value.app!=='MyUniverse'||value.version!==1||!value.data||!Array.isArray(value.data.dreams))throw Error('wrong');if(confirm('Импорт заменит текущие данные этого прототипа. Продолжить?')){state={...seedState,...value.data,profile:{...seedState.profile,...value.data.profile}};save();render();toast('Импорт завершён')}}catch(err){alert('Неверный формат резервной копии')}};r.readAsText(file)}function toast(s){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:50;background:#e0c489;color:#21192b;border-radius:12px;padding:12px 16px;box-shadow:0 7px 25px #0009;font-size:13px;white-space:nowrap';document.body.appendChild(e)}e.textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.remove(),1800)}
function syncSharedIdentity(){try{if(!window.SharedIdentity||typeof window.SharedIdentity.readProfile!=='function')return;const raw=window.SharedIdentity.readProfile();if(!raw)return;const data=JSON.parse(raw);if(!data||typeof data!=='object')return;const updated={...state.profile};if(Object.prototype.hasOwnProperty.call(data,'name'))updated.name=String(data.name).slice(0,80);if(Object.prototype.hasOwnProperty.call(data,'birth'))updated.birth=String(data.birth).slice(0,10);if(Object.prototype.hasOwnProperty.call(data,'sign')&&Number.isInteger(data.sign)&&data.sign>=0&&data.sign<12)updated.sign=data.sign;if(JSON.stringify(updated)!==JSON.stringify(state.profile)){state.profile=updated;save()}}catch(e){console.warn('Shared profile unavailable',e)}}
restoreNativeState();syncSharedIdentity();render();
</script>
<script>

    b.addEventListener('click',function(){
